# Proves the deliverable on a clean Linux machine: `docker compose up` starts
# headless Gazebo and /odom publishes. The log is attached to every run.
name: verify-sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yml
        run: docker compose config --quiet

      - name: Build, start and check /odom
        run: bash scripts/verify.sh

      - name: Show evidence on the run page
        if: always()
        run: |
          {
            echo '## Verification evidence'
            echo '```'
            cat proof/verify.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^RESULT' proof/verify.log | sed 's/^/::notice title=Result::/'
          grep -E 'gazebo' proof/verify.log | head -2 | sed 's/^/::notice title=Gazebo process::/'
          grep -E '^/odom$|average rate' proof/verify.log | tr '\n' ' ' | sed 's/^/::notice title=odom::/'; echo

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: proof/verify.log

      - name: Stop simulation
        if: always()
        run: docker compose down
