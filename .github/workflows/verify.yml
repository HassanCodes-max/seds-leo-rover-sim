# Proves the deliverable on a clean Linux machine: `docker compose up` starts
# headless Gazebo and /odom publishes. The log is attached to every run.
name: verify-sim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yml
        run: docker compose config --quiet

      - name: Build, start and check /odom
        run: bash scripts/verify.sh

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: proof/verify.log

      - name: Stop simulation
        if: always()
        run: docker compose down
